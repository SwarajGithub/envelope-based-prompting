# v3 test split: all 100 test records, all three conditions, 3 seeds.
# v3 envelope: num_predict=1024, strengthened menu+amount templates.
# ONE-SHOT: this is the held-out test split. Do not re-run after unblinding.
# Run from src/:   python -m fenced_retry.cli run --config configs/v3-test.toml

[run]
name = "v3-test"
envelope = "envelopes/receipt-extract-v3.json"
data = "../data/cord"
split = "test"
offset = 0
limit = 100
conditions = ["controller", "single_shot", "naive_retry"]
seeds = [0, 1, 2]
project = "test-v3"
shadow = false
store_full_text = true
final = true
runs_dir = "runs"
