# Second train block (protocol decision, 2026-10-19): calibrate m on more failures.
# Records 100 to 499 of the clean train subset, controller only, one seed (temperature 0).
# Expected: about 400 model calls. Run from src with the venv active:
#   python -m fenced_retry.cli run --config configs/train-block-02.toml

[run]
name = "pilot"
envelope = "envelopes/receipt-extract-v1.json"
data = "../data/cord"
split = "train"
offset = 100
limit = 400
conditions = ["controller"]
seeds = [0]
project = "pilot"
shadow = false
store_full_text = true
final = false
runs_dir = "runs"
