# v2 validation split: all conditions, seed 0 only (temp=0.3 makes multi-seed meaningful;
# start with one seed for prompt debugging before spending on all three).
# Run from src/:   python -m fenced_retry.cli run --config configs/v2-validation.toml

[run]
name = "v2-pilot"
envelope = "envelopes/receipt-extract-v2.json"
data = "../data/cord"
split = "validation"
offset = 0
limit = 93
conditions = ["controller", "single_shot", "naive_retry"]
seeds = [0]
project = "pilot-v2"
shadow = false
store_full_text = true
final = false
runs_dir = "runs"
